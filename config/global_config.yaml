global:
  max_open_trades: 3
  # 2026-07-05: enabled -- core/news_calendar.py enforces the 5ers rule
  # (no entries / bot exits within +/-5 min of high-impact news).
  # Fails OPEN during demo (see module docstring); revisit pre-challenge.
  news_filter: true
  friday_close_utc: "20:00"
  eod_close_enabled: false
  friday_close_enabled: true
  demo_mode: true
  log_level: INFO
  hard_floor_pct: 0.10
  daily_loss_pct: 0.05

  # ---- per-instance account settings (multi-account support, 2026-07-09)
  # Each bot clone (demo / prop firm) edits ONLY this block. agent_risk
  # derives: HARD_FLOOR = starting_balance * (1 - hard_floor_pct);
  # daily limit = starting_balance * daily_loss_pct.
  starting_balance: 100000
  # broker cap on lot size -- SCALE THIS WITH THE ACCOUNT (2.0 fits 100k;
  # a 5k-20k account needs ~0.1-0.5 or tight-SL trades will over-risk)
  max_lot: 2.0
  # multiplies every strategy's risk_percent -- set e.g. 0.5 on a fresh
  # prop account to run the whole book at half risk initially
  risk_scale: 1.0
  # ---- MT5 terminal binding (REQUIRED once 2 terminals are installed;
  # a bare initialize() is ambiguous about which terminal it attaches to)
  # e.g. "C:\\Program Files\\FivePercentOnline MT5\\terminal64.exe"
  mt5_terminal_path: ""
  # optional headless login; 0 = use the terminal's saved login (preferred).
  # If set, the password is read from the MT5_PASSWORD env var -- NEVER
  # stored in this file (this repo is public).
  mt5_login: 0
  mt5_server: ""
