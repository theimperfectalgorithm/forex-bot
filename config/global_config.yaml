global:
  max_open_trades: 3
  # 2026-07-05: enabled -- core/news_calendar.py enforces the 5ers rule
  # (no entries / bot exits within +/-5 min of high-impact news).
  # Fails OPEN during demo (see module docstring); revisit pre-challenge.
  news_filter: true
  friday_close_utc: "20:00"
  eod_close_enabled: false
  friday_close_enabled: true
  demo_mode: true
  log_level: INFO
  hard_floor_pct: 0.10
  daily_loss_pct: 0.05
  prop_daily_reference_model: higher_of_day_start_balance_or_equity
  prop_day_boundary_model: mt5_server_midnight
  # step-1 profit target as a fraction of starting_balance (5ers Classic:
  # 8%). Used only for reporting's "vs Target" line -- no gate depends on it.
  profit_target_pct: 0.08

  # ---- per-instance account settings (multi-account support, 2026-07-09)
  # DO NOT edit these on a VPS clone -- put overrides in the gitignored
  # config/local_config.yaml instead (same schema: a top-level 'global:'
  # block with just the keys you override). That keeps 'git pull' clean.
  # core/account_config.py is the SINGLE SOURCE OF TRUTH derived from
  # starting_balance -- agent_risk, agent_market, and agent_reporting all
  # import from it (never hardcode account numbers in an agent again;
  # see core/account_config.py's docstring for the 2026-07-19 incident
  # this fixed). HARD_FLOOR = starting_balance * (1-hard_floor_pct);
  # daily limit = starting_balance * daily_loss_pct; TARGET_BALANCE =
  # starting_balance * (1+profit_target_pct).
  starting_balance: 100000
  # broker cap on lot size -- SCALE THIS WITH THE ACCOUNT (2.0 fits 100k;
  # a 5k-20k account needs ~0.1-0.5 or tight-SL trades will over-risk)
  max_lot: 2.0
  # multiplies every strategy's risk_percent -- set e.g. 0.5 on a fresh
  # prop account to run the whole book at half risk initially
  risk_scale: 1.0
  # ---- MT5 terminal binding (REQUIRED once 2 terminals are installed;
  # a bare initialize() is ambiguous about which terminal it attaches to)
  # e.g. "C:\\Program Files\\FivePercentOnline MT5\\terminal64.exe"
  mt5_terminal_path: ""
  # optional headless login; 0 = use the terminal's saved login (preferred).
  # If set, the password is read from the MT5_PASSWORD env var -- NEVER
  # stored in this file (this repo is public).
  mt5_login: 0
  mt5_server: ""
  # Required fail-closed identity expectations for live instances. These
  # validate the account already selected in the configured terminal; they
  # do NOT trigger an automatic login. Set per instance in local_config.
  expected_mt5_login: 0
  expected_mt5_server: ""
  expected_mt5_terminal_path: ""
  # true only if this instance's terminal is a folder-copy launched with
  # the /portable flag (Method B) rather than a normal second install
  mt5_portable: false
  # news gate behavior when the calendar feed AND cache are unavailable:
  # false = fail-open (demo default), true = BLOCK entries (REQUIRED on
  # challenge/funded instances -- set in their local_config.yaml)
  news_fail_closed: false
  # blackout half-window in minutes around high-impact events. The 5ers
  # official rule is +/-2 min (server time); 5 keeps a clock-skew margin.
  news_window_min: 5
  # spread gate (agent_risk.run, added 2026-07-31): reject an entry
  # when the live spread exceeds this fraction of the trade's SL distance.
  # July 2026: the live broker widened spreads to 12-31p at the server-
  # midnight rollover vs 8-17p AMR stops -- entering there pays most of
  # the stop up front. Fails open on a missing tick.
  spread_max_frac_of_sl: 0.30
