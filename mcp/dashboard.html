<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TIA Control Center</title>
<style>
/* ═══════════════════════ TOKENS ═══════════════════════ */
:root {
  --bg:     #0d0d0d;
  --card:   #1a1a19;
  --card2:  #222220;
  --ink:    #ffffff;
  --ink2:   #c3c2b7;
  --muted:  #898781;
  --grid:   #2c2c2a;
  --brand:  #17e88f;   /* TIA green: brand accents + positive values        */
  --green:  #0ca30c;   /* fills / badge tints only (too dark for small text) */
  --red:    #e0524b;
  --amber:  #fab219;
  --blue:   #3987e5;   /* balance/equity series color, everywhere            */
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1.45;
  padding-bottom: 32px;
  overflow-x: hidden;   /* wide tables scroll inside their own .scroll-x */
}
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--brand); }
.neg { color: var(--red); }

/* ═══════════════════════ HEADER / TABS ═══════════════════════ */
header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(13,13,13,.92);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--grid);
  padding: 8px 14px 0;
}
.hdr-row { display: flex; align-items: center; justify-content: space-between;
           max-width: 1100px; margin: 0 auto; min-width: 0; padding-bottom: 6px; }
.hdr-tabs { max-width: 1100px; margin: 0 auto; border-top: 1px solid var(--grid); }
.brand-mini { display: flex; align-items: baseline; gap: 7px; padding-right: 10px;
              flex: none; }
.brand-mini b { font-size: 17px; letter-spacing: .28em; color: var(--ink); }
.brand-mini span { font-size: 9px; letter-spacing: .14em; color: var(--muted);
                   text-transform: uppercase; }
#updated { color: var(--muted); font-size: 12px; white-space: nowrap; padding-left: 10px;
           min-width: 0; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
nav.tabs { display: flex; gap: 6px; flex: 1; min-width: 0; }
.tab {
  flex: 1; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 6px; border: 0; border-bottom: 2px solid transparent;
  background: none; color: var(--ink2);
  font: inherit; font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;
}
.tab.active { color: var(--ink); border-bottom-color: var(--brand); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.ok   { background: var(--brand); }
.dot.warn { background: var(--amber); }
.dot.down { background: var(--red); }

/* ═══════════════════════ LAYOUT ═══════════════════════ */
main { max-width: 640px; margin: 0 auto; padding: 14px; }
.account-view { display: none; flex-direction: column; gap: 14px; }
.account-view.active { display: flex; }
.card {
  background: var(--card);
  border: 1px solid var(--grid);
  border-radius: 14px;
  padding: 16px;
  min-width: 0;
}
.card h2 {
  font-size: 12px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
}
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 10px 0; }

/* subtabs */
.subtabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--grid);
           border-radius: 10px; padding: 4px; align-self: flex-start; }
.subtab { border: 0; background: none; color: var(--ink2); font: inherit; font-size: 13px;
          font-weight: 600; padding: 6px 18px; border-radius: 7px; cursor: pointer; }
.subtab.active { background: var(--card2); color: var(--brand); }
.view-overview, .view-content { display: none; flex-direction: column; gap: 14px; }
.view-overview.active, .view-content.active { display: flex; }

/* status bar */
.statusbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.status-item { background: var(--card); border: 1px solid var(--grid); border-radius: 12px;
               padding: 10px 14px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.status-item .dot { width: 9px; height: 9px; }
.status-item .lbl { color: var(--muted); font-size: 10px; text-transform: uppercase;
                    letter-spacing: .07em; }
.status-item .val { font-size: 14px; font-weight: 700; }
.status-item .val.live { color: var(--brand); }
.status-item .val.stopped { color: var(--red); }

/* stat tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--grid); border-radius: 12px;
        padding: 12px 14px; min-width: 0; }
.tile .lbl { color: var(--muted); font-size: 10px; text-transform: uppercase;
             letter-spacing: .07em; }
.tile .val { font-size: 21px; font-weight: 700; margin-top: 2px; }
.tile .sub { color: var(--muted); font-size: 11px; }
.tile canvas { display: block; width: 100%; height: 22px; margin-top: 8px; }

/* grid main (desktop) */
.grid-main { display: grid; gap: 14px; grid-template-columns: 1fr; }
.grid-main > .card { min-width: 0; }
@media (min-width: 900px) {
  main { max-width: 1100px; }
  .statusbar { grid-template-columns: repeat(4, 1fr); }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .grid-main {
    grid-template-columns: 2fr 1fr;
    grid-template-areas:
      "equity  perf"
      "risk    session"
      "trades  journal"
      "positions journal"
      "news    goal";
  }
  .card.equity    { grid-area: equity; }
  .card.perf      { grid-area: perf; }
  .card.risk      { grid-area: risk; }
  .card.session   { grid-area: session; }
  .card.trades    { grid-area: trades; }
  .card.journal   { grid-area: journal; }
  .card.positions { grid-area: positions; }
  .card.news      { grid-area: news; }
  .card.goal      { grid-area: goal; }
}

/* perf list */
.perf-row { display: flex; justify-content: space-between; padding: 7px 0;
            border-top: 1px solid var(--grid); font-size: 13px; color: var(--ink2); }
.perf-row:first-of-type { border-top: 0; }
.perf-row b { color: var(--ink); font-weight: 650; }

/* risk donut */
.risk-wrap { display: flex; align-items: center; gap: 18px; }
.donut { width: 110px; height: 110px; flex: none; }
.donut text { fill: var(--ink); font-size: 22px; font-weight: 700; }
.donut .donut-sub { fill: var(--muted); font-size: 9px; font-weight: 400; }
.risk-facts { flex: 1; min-width: 0; }
.risk-facts .perf-row:first-of-type { border-top: 0; }

/* session pills */
.sess { display: flex; align-items: center; justify-content: space-between;
        background: var(--card2); border-radius: 10px; padding: 11px 14px;
        margin-bottom: 10px; }
.sess:last-of-type { margin-bottom: 0; }
.sess .name { font-weight: 650; font-size: 14px; }
.sess .hours { color: var(--muted); font-size: 11px; }
.sess .st { font-size: 12px; font-weight: 700; }
.sess .st.active   { color: var(--brand); }
.sess .st.upcoming { color: var(--amber); }
.sess .st.closed   { color: var(--muted); }
.sess-note { color: var(--muted); font-size: 12px; margin-top: 10px; }
.sess-note b { color: var(--amber); font-weight: 650; }

/* bars */
.bar-row { margin-bottom: 14px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-head { display: flex; justify-content: space-between; font-size: 13px;
            color: var(--ink2); margin-bottom: 6px; }
.bar-head b { color: var(--ink); font-weight: 650; }
.bar { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px;
           background: var(--brand); transition: width .5s ease; }
.bar > i.loss   { background: var(--amber); }
.bar > i.danger { background: var(--red); }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-size: 11px; font-weight: 600;
     text-transform: uppercase; letter-spacing: .05em; padding: 0 8px 7px 0; }
td { padding: 7px 8px 7px 0; border-top: 1px solid var(--grid); }
th.r, td.r { text-align: right; }
th:last-child, td:last-child { padding-right: 0; }
th.r + th, td.r + td { padding-left: 10px; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 5px;
         font-size: 11px; font-weight: 700; }
.badge.buy  { background: rgba(12,163,12,.15);  color: var(--brand); }
.badge.sell { background: rgba(224,82,75,.15); color: var(--red); }
.sub { color: var(--muted); font-size: 11px; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* equity chart */
.chart-head { display: flex; align-items: center; justify-content: space-between;
              margin-bottom: 12px; }
.chart-head h2 { margin-bottom: 0; }
.ranges { display: flex; gap: 4px; }
.range-btn { border: 1px solid var(--grid); background: none; color: var(--ink2);
             font: inherit; font-size: 11px; font-weight: 600; padding: 3px 10px;
             border-radius: 6px; cursor: pointer; }
.range-btn.active { border-color: var(--brand); color: var(--brand); }
.chart-wrap { position: relative; }
svg.equity { display: block; width: 100%; height: 210px; touch-action: pan-y; }
.tip { position: absolute; top: 4px; left: 8px; pointer-events: none;
       background: var(--card2); border: 1px solid var(--grid); border-radius: 8px;
       padding: 4px 9px; font-size: 12px; color: var(--ink2); display: none; }
.tip b { color: var(--ink); }

/* journal cards */
.j-card { background: var(--card2); border-radius: 10px; padding: 11px 13px;
          margin-bottom: 10px; font-size: 13px; }
.j-card:last-of-type { margin-bottom: 0; }
.j-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.j-head b { font-size: 14px; }
.j-head .sub { margin-left: auto; }
.j-reason { color: var(--ink2); }
.j-ctx { color: var(--muted); font-size: 11px; margin-top: 4px; }
.j-exit { margin-top: 6px; font-size: 12px; font-weight: 650; }

/* news */
.news-row { display: flex; align-items: center; gap: 10px; padding: 8px 0;
            border-top: 1px solid var(--grid); font-size: 13px; }
.news-row:first-of-type { border-top: 0; }
.news-cur { flex: none; background: var(--card2); border-radius: 6px; padding: 2px 8px;
            font-size: 11px; font-weight: 700; color: var(--amber); }
.news-title { flex: 1; min-width: 0; color: var(--ink2); overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
.news-in { flex: none; font-weight: 650; }
.news-stale { color: var(--amber); font-size: 11px; margin-top: 8px; }

/* footer / brand */
.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
        color: var(--muted); font-size: 12px; align-items: center; }
.brandline { display: flex; flex-direction: column; gap: 2px; }
.brandline b { color: var(--ink2); letter-spacing: .22em; font-size: 13px; }
.brandline span { font-size: 11px; }
.socials { display: flex; gap: 10px; }
.socials a { color: var(--muted); display: inline-flex; }
.socials svg { width: 18px; height: 18px; fill: currentColor; }

/* content view */
.gen-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.week-nav { display: flex; align-items: center; gap: 8px; }
.gen-btn { border: 0; border-radius: 10px; background: var(--brand); color: #06130c;
           font: inherit; font-size: 14px; font-weight: 700; padding: 11px 20px;
           cursor: pointer; }
.gen-btn:disabled { opacity: .5; }
.gen-week { color: var(--ink2); font-size: 13px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
           gap: 12px; margin-top: 16px; }
.slide-box { background: var(--card2); border-radius: 10px; padding: 8px; }
.slide-box canvas { display: block; width: 100%; height: auto; border-radius: 6px; }
.slide-box .dl { display: flex; justify-content: space-between; align-items: center;
                 margin-top: 7px; }
.slide-box .dl span { color: var(--muted); font-size: 11px; }
.dl-btn { border: 1px solid var(--brand); background: none; color: var(--brand);
          font: inherit; font-size: 11px; font-weight: 700; padding: 3px 10px;
          border-radius: 6px; cursor: pointer; }
.gen-note { color: var(--muted); font-size: 12px; margin-top: 10px; }

/* down state */
.down-card { text-align: center; padding: 34px 16px; }
.down-card .big { font-size: 17px; font-weight: 650; margin-bottom: 6px; }
.down-card p { color: var(--muted); font-size: 13px; }
#nokey { max-width: 640px; margin: 60px auto; padding: 0 20px;
         text-align: center; color: var(--ink2); display: none; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <div class="brand-mini"><b>T I A</b><span>Control Center</span></div>
    <span id="updated" class="num"></span>
  </div>
  <div class="hdr-tabs">
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main id="views"></main>

<div id="nokey">
  <p><b>Missing dashboard key.</b></p>
  <p style="margin-top:8px">Open this page with <span class="num">?key=&lt;token&gt;</span> in the URL.</p>
</div>

<template id="account-tpl">
  <section class="account-view">
    <nav class="subtabs">
      <button class="subtab active" data-view="overview">Overview</button>
      <button class="subtab" data-view="content">Content</button>
    </nav>

    <!-- ═══════════ OVERVIEW ═══════════ -->
    <div class="view-overview active">

      <div class="statusbar">
        <div class="status-item"><span class="dot" data-f="d_bot"></span>
          <div><div class="lbl">Bot status</div><div class="val" data-f="v_bot">—</div></div></div>
        <div class="status-item"><span class="dot" data-f="d_broker"></span>
          <div><div class="lbl">Broker</div><div class="val" data-f="v_broker">—</div></div></div>
        <div class="status-item"><span class="dot" data-f="d_trade"></span>
          <div><div class="lbl">Trading</div><div class="val" data-f="v_trade">—</div></div></div>
        <div class="status-item"><span class="dot" data-f="d_srv"></span>
          <div><div class="lbl">Servers</div><div class="val" data-f="v_srv">—</div></div></div>
      </div>

      <div class="tiles">
        <div class="tile"><div class="lbl">Account balance</div>
          <div class="val num" data-f="t_bal">—</div>
          <div class="sub num" data-f="t_eq">equity —</div>
          <canvas data-f="s_bal" width="160" height="22"></canvas></div>
        <div class="tile"><div class="lbl">Today's P&amp;L</div>
          <div class="val num" data-f="t_day">—</div>
          <div class="sub num" data-f="t_day_pct"></div>
          <canvas data-f="s_day" width="160" height="22"></canvas></div>
        <div class="tile"><div class="lbl">Week's P&amp;L</div>
          <div class="val num" data-f="t_week">—</div>
          <div class="sub"></div>
          <canvas data-f="s_week" width="160" height="22"></canvas></div>
        <div class="tile"><div class="lbl">Month's P&amp;L</div>
          <div class="val num" data-f="t_month">—</div>
          <div class="sub"></div>
          <canvas data-f="s_month" width="160" height="22"></canvas></div>
      </div>

      <div class="grid-main">

        <div class="card equity">
          <div class="chart-head"><h2>Equity curve</h2>
            <div class="ranges">
              <button class="range-btn" data-range="7">7D</button>
              <button class="range-btn" data-range="30">30D</button>
              <button class="range-btn active" data-range="all">All</button>
            </div></div>
          <div class="chart-wrap">
            <svg class="equity" data-f="chart" preserveAspectRatio="none"></svg>
            <div class="tip" data-f="tip"></div>
          </div>
        </div>

        <div class="card perf">
          <h2>Performance <span class="sub num" data-f="perf_period"></span></h2>
          <div class="perf-row"><span>Total trades</span><b class="num" data-f="p_count">—</b></div>
          <div class="perf-row"><span>Win rate</span><b class="num" data-f="p_wr">—</b></div>
          <div class="perf-row"><span>Profit factor</span><b class="num" data-f="p_pf">—</b></div>
          <div class="perf-row"><span>Avg R:R (planned)</span><b class="num" data-f="p_rr">—</b></div>
          <div class="perf-row"><span>Best trade</span><b class="num" data-f="p_best">—</b></div>
          <div class="perf-row"><span>Worst trade</span><b class="num" data-f="p_worst">—</b></div>
          <div class="perf-row"><span>Max drawdown</span><b class="num" data-f="p_dd">—</b></div>
          <div class="perf-row"><span>Expectancy</span><b class="num" data-f="p_exp">—</b></div>
        </div>

        <div class="card risk">
          <h2>Risk overview</h2>
          <div class="risk-wrap">
            <svg class="donut" data-f="donut" viewBox="0 0 110 110"></svg>
            <div class="risk-facts">
              <div class="perf-row"><span>Daily loss limit</span><b class="num" data-f="r_limit">—</b></div>
              <div class="perf-row"><span>Used</span><b class="num" data-f="r_used">—</b></div>
              <div class="perf-row"><span>Remaining</span><b class="num" data-f="r_rem">—</b></div>
              <div class="perf-row"><span>Open positions</span><b class="num" data-f="r_open">—</b></div>
            </div>
          </div>
        </div>

        <div class="card session">
          <h2>Sessions <span class="sub">(UTC)</span></h2>
          <div class="sess"><div><div class="name">London</div>
            <div class="hours">07:00 – 16:00</div></div>
            <span class="st" data-f="sess_ldn">—</span></div>
          <div class="sess"><div><div class="name">New York</div>
            <div class="hours">12:00 – 21:00</div></div>
            <span class="st" data-f="sess_ny">—</span></div>
          <div class="sess-note" data-f="sess_note"></div>
        </div>

        <div class="card positions">
          <h2>Open positions</h2>
          <div class="scroll-x"><table data-f="positions"></table></div>
          <div class="empty" data-f="positions_empty" hidden>No open positions</div>
        </div>

        <div class="card trades">
          <h2>Recent trades</h2>
          <div class="scroll-x"><table data-f="trades"></table></div>
          <div class="empty" data-f="trades_empty" hidden>No closed trades yet</div>
        </div>

        <div class="card journal">
          <h2>Journal</h2>
          <div data-f="journal_list"></div>
          <div class="empty" data-f="journal_empty" hidden>No journal entries yet</div>
        </div>

        <div class="card news">
          <h2>Upcoming news <span class="sub">(high impact)</span></h2>
          <div data-f="news_list"></div>
          <div class="empty" data-f="news_empty" hidden>No upcoming high-impact events</div>
          <div class="news-stale" data-f="news_stale" hidden>⚠ calendar cache is stale</div>
        </div>

        <div class="card goal">
          <h2>Challenge progress</h2>
          <div class="bar-row">
            <div class="bar-head"><span>Profit target <b class="num" data-f="target_amt"></b></span>
              <b class="num" data-f="target_pct">—</b></div>
            <div class="bar"><i data-f="target_bar" style="width:0%"></i></div>
          </div>
          <div class="bar-row">
            <div class="bar-head"><span>Daily loss limit used</span>
              <b class="num" data-f="loss_pct">—</b></div>
            <div class="bar"><i class="loss" data-f="loss_bar" style="width:0%"></i></div>
          </div>
          <div class="bar-head" style="margin-bottom:0">
            <span>Distance to hard floor <span class="sub num" data-f="floor_amt"></span></span>
            <b class="num" data-f="floor_dist">—</b>
          </div>
        </div>

      </div><!-- /grid-main -->

      <div class="card foot">
        <span data-f="foot_trades">—</span>
        <div class="brandline"><b>T I A</b>
          <span>Built in Public. Traded in Public. Learning in Public.</span></div>
        <div class="socials">
          <a href="#" aria-label="YouTube"><svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4L15.8 12z"/></svg></a>
          <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.9.2 2.3.4.6.2 1 .5 1.4.9.4.4.7.9.9 1.4.2.4.4 1.1.4 2.3.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.9-.4 2.3a3.8 3.8 0 0 1-.9 1.4 3.8 3.8 0 0 1-1.4.9c-.4.2-1.1.4-2.3.4-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.9-.2-2.3-.4a3.8 3.8 0 0 1-1.4-.9 3.8 3.8 0 0 1-.9-1.4c-.2-.4-.4-1.1-.4-2.3C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.9.4-2.3.2-.6.5-1 .9-1.4.4-.4.9-.7 1.4-.9.4-.2 1.1-.4 2.3-.4C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.1-1.1.1-1.7.2-2.1.4-.5.2-.9.4-1.2.8-.4.4-.6.7-.8 1.2-.2.4-.3 1-.4 2.1-.1 1.2-.1 1.6-.1 4.7s0 3.5.1 4.7c.1 1.1.2 1.7.4 2.1.2.5.4.9.8 1.2.4.4.7.6 1.2.8.4.2 1 .3 2.1.4 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1.1-.1 1.7-.2 2.1-.4.5-.2.9-.4 1.2-.8.4-.4.6-.7.8-1.2.2-.4.3-1 .4-2.1.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1.1-.2-1.7-.4-2.1a2 2 0 0 0-.8-1.2 2 2 0 0 0-1.2-.8c-.4-.2-1-.3-2.1-.4-1.2-.1-1.6-.1-4.7-.1zm0 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 1.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4zm6.4-2.1a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0z"/></svg></a>
          <a href="#" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M11.9 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.9 6.8-1.6 7.8c-.1.6-.5.7-.9.4l-2.5-1.9-1.2 1.2c-.2.2-.3.3-.6.3l.2-2.6 4.6-4.2c.2-.2 0-.3-.3-.1l-5.7 3.6-2.5-.8c-.5-.2-.5-.5.1-.8l9.6-3.7c.5-.2.9.1.8.8z"/></svg></a>
        </div>
        <span data-f="foot_bot">—</span>
      </div>

    </div><!-- /view-overview -->

    <!-- ═══════════ CONTENT ═══════════ -->
    <div class="view-content">
      <div class="card">
        <h2>Weekly report generator</h2>
        <div class="gen-head">
          <button class="gen-btn" data-f="gen_btn">Generate Weekly Report</button>
          <div class="week-nav">
            <button class="range-btn" data-f="wk_prev" aria-label="Previous week">◀</button>
            <span class="gen-week num" data-f="gen_week"></span>
            <button class="range-btn" data-f="wk_next" aria-label="Next week">▶</button>
          </div>
        </div>
        <div class="gallery" data-f="gallery"></div>
        <div class="gen-note">Renders in your browser from this account's live data —
          5 Instagram carousel slides (1080×1350) + 1 YouTube thumbnail background
          (1920×1080). Tap Save under each image.</div>
      </div>
    </div>

  </section>
</template>

<script>
'use strict';

/* ═══════════════════════ BOOT / STATE ═══════════════════════ */
const KEY   = new URLSearchParams(location.search).get('key') || '';
const PORTS = [8000, 8001];
const HOSTS = PORTS.map(p => `${location.protocol}//${location.hostname}:${p}`);
const HDRS  = { 'X-Dash-Key': KEY };
const C = { bg: '#0d0d0d', card: '#1a1a19', card2: '#222220', ink: '#ffffff',
            ink2: '#c3c2b7', muted: '#898781', grid: '#2c2c2a', brand: '#17e88f',
            red: '#e0524b', amber: '#fab219', blue: '#3987e5' };

const state = HOSTS.map((h, i) => ({
  host: h, label: `Account ${i + 1}`, up: false, mt5: false,
  summary: null, trades: null, equity: null, stats: null,
  journal: null, news: null, botState: null,
  range: 'all', subview: 'overview', weekOffset: 0,
}));
let activeIdx = 0, lastUpdate = null;

/* ═══════════════════════ FORMATTING ═══════════════════════ */
const money = v => v == null ? '—'
  : '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signedMoney = v => v == null ? '—' : (v >= 0 ? '+' : '−') + money(v);
function pnlCell(el, v) {
  el.textContent = signedMoney(v);
  el.classList.remove('pos', 'neg');
  if (v != null) el.classList.add(v >= 0 ? 'pos' : 'neg');
}
const fmtR = r => r == null ? '—' : (r >= 0 ? '+' : '−') + Math.abs(r).toFixed(2) + 'R';

/* ═══════════════════════ DOM BUILD ═══════════════════════ */
const tabsEl  = document.getElementById('tabs');
const viewsEl = document.getElementById('views');
const tpl     = document.getElementById('account-tpl');

state.forEach((acc, i) => {
  const tab = document.createElement('button');
  tab.className = 'tab';
  tab.innerHTML = `<span class="dot"></span><span class="tab-label">${acc.label}</span>`;
  tab.addEventListener('click', () => setActive(i));
  tabsEl.appendChild(tab);
  acc.tabEl = tab;
  buildView(acc);
});

function buildView(acc) {
  const view = tpl.content.firstElementChild.cloneNode(true);
  if (acc.viewEl) acc.viewEl.replaceWith(view); else viewsEl.appendChild(view);
  acc.viewEl = view;
  acc.el = f => view.querySelector(`[data-f="${f}"]`);
  // subtabs
  view.querySelectorAll('.subtab').forEach(b => b.addEventListener('click', () => {
    acc.subview = b.dataset.view;
    view.querySelectorAll('.subtab').forEach(x =>
      x.classList.toggle('active', x === b));
    view.querySelector('.view-overview').classList.toggle('active', acc.subview === 'overview');
    view.querySelector('.view-content').classList.toggle('active', acc.subview === 'content');
    if (acc.subview === 'content') updateWeekLabel(acc);
  }));
  // range picker
  view.querySelectorAll('.range-btn').forEach(b => b.addEventListener('click', () => {
    acc.range = b.dataset.range;
    view.querySelectorAll('.range-btn').forEach(x =>
      x.classList.toggle('active', x === b));
    drawEquity(acc);
    fetchStats(acc).then(() => renderSlow(acc));
  }));
  // report button + week navigation
  acc.el('gen_btn').addEventListener('click', () => generateReport(acc));
  acc.el('wk_prev').addEventListener('click', () => {
    acc.weekOffset += 1; updateWeekLabel(acc);
  });
  acc.el('wk_next').addEventListener('click', () => {
    acc.weekOffset = Math.max(0, acc.weekOffset - 1); updateWeekLabel(acc);
  });
}

function setActive(i) {
  activeIdx = i;
  state.forEach((acc, j) => {
    acc.tabEl.classList.toggle('active', j === i);
    acc.viewEl.classList.toggle('active', j === i);
  });
}
setActive(Math.min(
  parseInt(new URLSearchParams(location.search).get('tab'), 10) || 0,
  state.length - 1));

/* ═══════════════════════ FETCH TIERS ═══════════════════════ */
const FETCH_TIMEOUT_MS = 10_000;   // a hung server must show "unreachable",
                                    // not spin forever (2026-08-03 incident)
async function j(base, path) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    const r = await fetch(base + path, { headers: HDRS, signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

function statsDaysFor(acc) {
  return acc.range === '7' ? 7 : acc.range === '30' ? 30 : 0;
}
async function fetchStats(acc) {
  try { acc.stats = await j(acc.host, '/api/stats?days=' + statsDaysFor(acc)); }
  catch (e) {}
}

async function refreshFast() {          // 45s tier
  await Promise.allSettled(state.map(async acc => {
    try {
      const [summary, trades] = await Promise.all([
        j(acc.host, '/api/summary'),
        j(acc.host, '/api/trades?limit=20'),
      ]);
      acc.summary = summary; acc.trades = trades;
      acc.up = true; acc.mt5 = !!summary.status.mt5_available;
      if (summary.label) acc.label = summary.label;
    } catch (e) { acc.up = false; }
  }));
  lastUpdate = Date.now();
  state.forEach(renderAccount);
}

async function refreshSlow() {          // 5min tier
  await Promise.allSettled(state.map(async acc => {
    const grab = (p, k) => j(acc.host, p).then(d => { acc[k] = d; }).catch(() => {});
    await Promise.allSettled([
      grab('/api/equity', 'equity'),
      fetchStats(acc),
      grab('/api/journal?limit=5', 'journal'),
      grab('/api/news', 'news'),
      grab('/api/state', 'botState'),
    ]);
  }));
  state.forEach(acc => { if (acc.up) { renderSlow(acc); drawEquity(acc); } });
}

/* ═══════════════════════ RENDER: FAST ═══════════════════════ */
function renderAccount(acc) {
  acc.tabEl.querySelector('.tab-label').textContent = acc.label;
  const dot = acc.tabEl.querySelector('.dot');
  dot.className = 'dot ' + (!acc.up ? 'down' : acc.mt5 ? 'ok' : 'warn');

  if (!acc.up) {
    acc.viewEl.innerHTML = `<div class="card down-card">
        <div class="big">${acc.label} unreachable</div>
        <p>Could not reach ${acc.host}.<br>The server may be stopped, or the port blocked.</p>
      </div>`;
    acc.el = () => null;
    acc.wasDown = true;
    return;
  }
  if (acc.wasDown) {                    // rebuild the full template
    acc.wasDown = false;
    buildView(acc);
    setActive(activeIdx);
    renderSlow(acc); drawEquity(acc);
  }

  const s = acc.summary, st = s.status, t = s.today, a = s.account, p = s.progress;

  // status bar
  const pr = st.process_running || {};
  setStatus(acc, 'bot', pr.running === true ? 'ok' : pr.running === false ? 'down' : 'warn',
            pr.running === true ? 'LIVE' : pr.running === false ? 'STOPPED' : 'UNKNOWN',
            pr.running === true ? 'live' : pr.running === false ? 'stopped' : '');
  setStatus(acc, 'broker', st.mt5_available ? 'ok' : 'down',
            st.mt5_available ? 'CONNECTED' : 'OFFLINE');
  renderTradeStatus(acc);
  const upCount = state.filter(x => x.up).length;
  setStatus(acc, 'srv', upCount === state.length ? 'ok' : 'warn',
            `${upCount}/${state.length} ONLINE`);

  // tiles
  acc.el('t_bal').textContent = money(st.balance);
  acc.el('t_eq').textContent  = 'equity ' + money(st.equity);
  pnlCell(acc.el('t_day'), t.total_pnl);
  acc.el('t_day_pct').textContent = t.total_pnl != null && a.starting_balance
    ? '(' + (t.total_pnl >= 0 ? '+' : '−')
      + Math.abs(t.total_pnl / a.starting_balance * 100).toFixed(2) + '%)' : '';

  // risk card (uses summary numbers; donut)
  acc.el('r_limit').textContent = money(t.loss_limit_usd);
  const usedUsd = t.total_pnl != null ? Math.max(0, -t.total_pnl) : null;
  acc.el('r_used').textContent = usedUsd == null ? '—' : money(usedUsd);
  acc.el('r_rem').textContent = usedUsd == null || t.loss_limit_usd == null ? '—'
    : money(Math.max(0, t.loss_limit_usd - usedUsd));
  acc.el('r_open').textContent = (st.open_positions || []).length;
  drawDonut(acc.el('donut'), t.loss_limit_used_pct || 0);

  // goal card
  acc.el('target_amt').textContent = money(a.target_balance);
  acc.el('target_pct').textContent = p.to_target_pct == null ? '—' : p.to_target_pct + '%';
  acc.el('target_bar').style.width = Math.min(p.to_target_pct || 0, 100) + '%';
  acc.el('loss_pct').textContent   = (t.loss_limit_used_pct ?? 0) + '%';
  const lb = acc.el('loss_bar');
  lb.style.width = Math.min(t.loss_limit_used_pct || 0, 100) + '%';
  lb.classList.toggle('danger', (t.loss_limit_used_pct || 0) >= 80);
  acc.el('floor_amt').textContent  = '(' + money(a.hard_floor) + ')';
  acc.el('floor_dist').textContent = money(p.floor_distance_usd);

  // positions
  const posT = acc.el('positions');
  const posRows = st.open_positions || [];
  acc.el('positions_empty').hidden = posRows.length > 0;
  posT.innerHTML = posRows.length === 0 ? '' :
    '<tr><th>Pair</th><th>Dir</th><th class="r">Lots</th><th class="r">Entry</th>' +
    '<th class="r">Now</th><th class="r">P&L</th></tr>' +
    posRows.map(o => `<tr>
      <td><b>${o.pair}</b></td>
      <td><span class="badge ${o.direction === 'BUY' ? 'buy' : 'sell'}">${o.direction}</span></td>
      <td class="r num">${o.lots}</td>
      <td class="r num">${o.entry_price}</td>
      <td class="r num">${o.current_price}</td>
      <td class="r num ${o.pnl >= 0 ? 'pos' : 'neg'}">${signedMoney(o.pnl)}</td>
    </tr>`).join('');

  // trades (with R)
  const trT = acc.el('trades');
  const trRows = (acc.trades && acc.trades.trades) || [];
  acc.el('trades_empty').hidden = trRows.length > 0;
  trT.innerHTML = trRows.length === 0 ? '' :
    '<tr><th>Date</th><th>Pair</th><th>Dir</th><th class="r">R</th>' +
    '<th class="r">P&L</th><th>Exit</th></tr>' +
    trRows.map(o => `<tr>
      <td class="num sub">${(o.date || '').slice(5)}</td>
      <td><b>${o.pair}</b></td>
      <td><span class="badge ${o.direction === 'BUY' ? 'buy' : 'sell'}">${o.direction}</span></td>
      <td class="r num ${o.r == null ? 'sub' : o.r >= 0 ? 'pos' : 'neg'}">${fmtR(o.r)}</td>
      <td class="r num ${o.pnl >= 0 ? 'pos' : 'neg'}">${signedMoney(o.pnl)}</td>
      <td class="sub">${o.reason || ''}</td>
    </tr>`).join('');

  // sessions + footer
  renderSessions(acc);
  acc.el('foot_trades').textContent =
    `${st.today_trade_count} trade${st.today_trade_count === 1 ? '' : 's'} today`;
  acc.el('foot_bot').textContent =
    pr.running === true ? 'bot process running' :
    pr.running === false ? 'bot process NOT running' : 'bot process: unknown';

  if (acc.equity) drawEquity(acc);
}

function renderTradeStatus(acc) {
  const bs = acc.botState;
  setStatus(acc, 'trade',
            bs && bs.exists ? (bs.trade_allowed ? 'ok' : 'down') : 'warn',
            bs && bs.exists ? (bs.trade_allowed ? 'ALLOWED' : 'BLOCKED') : '—');
}

function setStatus(acc, key, dotCls, text, valCls) {
  const d = acc.el('d_' + key), v = acc.el('v_' + key);
  if (!d) return;
  d.className = 'dot ' + dotCls;
  v.textContent = text;
  v.className = 'val' + (valCls ? ' ' + valCls : '');
}

/* ═══════════════════════ RENDER: SLOW ═══════════════════════ */
function renderSlow(acc) {
  if (!acc.el || !acc.el('p_count')) return;
  renderTradeStatus(acc);   // /api/state arrives on this tier

  // performance card
  const stt = acc.stats && acc.stats.trades;
  acc.el('perf_period').textContent =
    acc.range === '7' ? '· 7 days' : acc.range === '30' ? '· 30 days' : '· all time';
  if (stt) {
    acc.el('p_count').textContent = stt.count;
    acc.el('p_wr').textContent = stt.win_rate_pct == null ? '—' : stt.win_rate_pct + '%';
    acc.el('p_pf').textContent = stt.profit_factor == null
      ? (stt.count ? '∞' : '—') : stt.profit_factor.toFixed(2);
    acc.el('p_rr').textContent = stt.avg_planned_rr == null ? '—' : stt.avg_planned_rr.toFixed(2);
    const bt = acc.stats.best_trade, wt = acc.stats.worst_trade;
    acc.el('p_best').textContent  = bt ? fmtR(bt.r) : '—';
    acc.el('p_best').className  = 'num ' + (bt && bt.r != null && bt.r >= 0 ? 'pos' : '');
    acc.el('p_worst').textContent = wt ? fmtR(wt.r) : '—';
    acc.el('p_worst').className = 'num ' + (wt && wt.r != null && wt.r < 0 ? 'neg' : '');
    acc.el('p_dd').textContent  = acc.stats.max_drawdown_pct + '%';
    acc.el('p_exp').textContent = stt.expectancy_r == null ? '—' : fmtR(stt.expectancy_r);
  }

  // week / month tiles + sparklines
  if (acc.stats) {
    pnlCell(acc.el('t_week'),  acc.stats.pnl.week_usd);
    pnlCell(acc.el('t_month'), acc.stats.pnl.month_usd);
    const sp = acc.stats.sparklines || {};
    drawSpark(acc.el('s_bal'),   sp.month, C.blue);
    drawSpark(acc.el('s_day'),   null,     C.muted);   // no intraday series exists
    drawSpark(acc.el('s_week'),  sp.week,  (acc.stats.pnl.week_usd  ?? 0) >= 0 ? C.brand : C.red);
    drawSpark(acc.el('s_month'), sp.month, (acc.stats.pnl.month_usd ?? 0) >= 0 ? C.brand : C.red);
  }

  // journal
  const jl = acc.el('journal_list');
  const cards = (acc.journal && acc.journal.cards) || [];
  acc.el('journal_empty').hidden = cards.length > 0;
  jl.innerHTML = cards.map(c => {
    const dt = (c.ts_utc || '').slice(5, 16).replace('T', ' ');
    let exitLine;
    if (c.exit) {
      const hh = c.exit.hold_hours != null ? ` after ${c.exit.hold_hours.toFixed(1)}h` : '';
      const rr = c.exit.r != null ? ` (${fmtR(c.exit.r)})` : '';
      exitLine = `<div class="j-exit ${c.exit.pnl >= 0 ? 'pos' : 'neg'}">
        Exit: ${c.exit.exit_reason || '?'}${hh}${rr} · ${signedMoney(c.exit.pnl)}</div>`;
    } else {
      exitLine = `<div class="j-exit sub">OPEN</div>`;
    }
    const ctx = c.context || {};
    const bits = [];
    if (ctx.spread_pips != null) bits.push(`spread ${ctx.spread_pips}p`);
    if (ctx.atr14_h1_pips != null) bits.push(`ATR ${ctx.atr14_h1_pips}p`);
    if (ctx.minutes_to_next_high_news != null)
      bits.push(`news in ${Math.round(ctx.minutes_to_next_high_news / 60)}h`);
    return `<div class="j-card">
      <div class="j-head"><span class="badge ${c.direction === 'BUY' ? 'buy' : 'sell'}">${c.direction}</span>
        <b>${c.symbol}</b><span class="sub num">${dt}</span></div>
      ${c.reason ? `<div class="j-reason">${c.reason}</div>` : ''}
      ${bits.length ? `<div class="j-ctx">${bits.join(' · ')}</div>` : ''}
      ${exitLine}</div>`;
  }).join('');

  // news
  renderNews(acc);
}

function renderNews(acc) {
  if (!acc.el || !acc.el('news_list')) return;
  const n = acc.news;
  const evs = (n && n.events) || [];
  acc.el('news_empty').hidden = evs.length > 0;
  acc.el('news_stale').hidden = !(n && n.stale);
  const now = Date.now();
  acc.el('news_list').innerHTML = evs.map(e => {
    const mins = Math.max(0, Math.round((new Date(e.time_utc) - now) / 60000));
    const inTxt = mins < 60 ? `${mins}m` : `${Math.floor(mins / 60)}h ${mins % 60}m`;
    const soon = mins <= 60;
    return `<div class="news-row"><span class="news-cur">${e.currency}</span>
      <span class="news-title">${e.title}</span>
      <span class="news-in num" style="color:${soon ? C.amber : C.ink2}">${inTxt}</span></div>`;
  }).join('');
}

function renderSessions(acc) {
  if (!acc.el || !acc.el('sess_ldn')) return;
  const h = new Date().getUTCHours() + new Date().getUTCMinutes() / 60;
  const setSess = (el, lo, hi) => {
    const stEl = acc.el(el);
    if (h >= lo && h < hi) { stEl.textContent = 'ACTIVE';   stEl.className = 'st active'; }
    else if (h < lo)       { stEl.textContent = 'UPCOMING'; stEl.className = 'st upcoming'; }
    else                   { stEl.textContent = 'CLOSED';   stEl.className = 'st closed'; }
  };
  setSess('sess_ldn', 7, 16);
  setSess('sess_ny', 12, 21);
  const bs = acc.botState, note = acc.el('sess_note');
  if (bs && bs.exists) {
    const bits = [];
    if (bs.avoid_reason) bits.push(`<b>AVOID:</b> ${bs.avoid_reason}`);
    if (bs.london_news_flag) bits.push('<b>London news flag</b>');
    if (bs.ny_news_flag) bits.push('<b>NY news flag</b>');
    const paused = Object.entries(bs.pair_paused || {}).filter(([, v]) => v).map(([k]) => k);
    if (paused.length) bits.push(`<b>paused:</b> ${paused.join(', ')}`);
    note.innerHTML = bits.length ? bits.join(' · ')
      : `prep: London ${bs.london_prep_done ? '✓' : '·'} / NY ${bs.ny_prep_done ? '✓' : '·'}`;
  } else {
    note.textContent = '';
  }
}

/* ═══════════════════════ SPARKLINES / DONUT ═══════════════════════ */
function drawSpark(canvas, vals, color) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (!vals || vals.length < 2) {          // honest flat dash -- no intraday data
    ctx.strokeStyle = C.grid; ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1; lo -= span * .1; hi += span * .1;
  const x = i => i / (vals.length - 1) * (W - 4) + 2;
  const y = v => 2 + (1 - (v - lo) / (hi - lo)) * (H - 4);
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.lineJoin = ctx.lineCap = 'round';
  ctx.beginPath();
  vals.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
  ctx.stroke();
}

function drawDonut(svg, pct) {
  if (!svg) return;
  const R = 44, CX = 55, CY = 55, CIRC = 2 * Math.PI * R;
  const p = Math.min(Math.max(pct, 0), 100);
  const color = p >= 80 ? C.red : p >= 50 ? C.amber : C.brand;
  svg.innerHTML = `
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${C.card2}" stroke-width="10"/>
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${color}" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="${(p / 100 * CIRC).toFixed(1)} ${CIRC.toFixed(1)}"
      transform="rotate(-90 ${CX} ${CY})"/>
    <text x="${CX}" y="${CY + 1}" text-anchor="middle">${Math.round(p)}%</text>
    <text x="${CX}" y="${CY + 16}" text-anchor="middle" class="donut-sub">DAILY RISK USED</text>`;
}

/* ═══════════════════════ EQUITY CHART ═══════════════════════ */
function normalizePoints(vals, rect, pad) {
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1; lo -= span * .08; hi += span * .08;
  const x = i => rect.l + i / (vals.length - 1) * (rect.w);
  const y = v => rect.t + (1 - (v - lo) / (hi - lo)) * (rect.h);
  return { x, y, lo, hi };
}

function equityPoints(acc) {
  const pts = ((acc.equity && acc.equity.curve) || [])
    .filter(r => r.balance != null)
    .map(r => ({ date: r.date, v: r.balance }));
  const lp = acc.equity && acc.equity.live_point;
  if (lp && lp.balance != null) pts.push({ date: lp.date, v: lp.balance, live: true });
  if (acc.range === '7')  return pts.slice(-8);
  if (acc.range === '30') return pts.slice(-31);
  return pts;
}

function drawEquity(acc) {
  const svg = acc.el && acc.el('chart');
  if (!svg || !acc.equity) return;
  const pts = equityPoints(acc);

  const W = 600, H = 210, PAD = { l: 8, r: 8, t: 14, b: 18 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (pts.length < 2) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" fill="${C.muted}" font-size="13"
      text-anchor="middle">Not enough history yet — check back after a few daily closes</text>`;
    return;
  }

  const base = acc.summary ? acc.summary.account.starting_balance : pts[0].v;
  const vals = pts.map(p => p.v).concat([base]);
  const rect = { l: PAD.l, t: PAD.t, w: W - PAD.l - PAD.r, h: H - PAD.t - PAD.b };
  const norm = normalizePoints(vals, rect);
  const px = i => rect.l + i / (pts.length - 1) * rect.w;
  const py = v => norm.y(v);

  const line = pts.map((p, i) => (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(p.v).toFixed(1)).join(' ');
  const area = line + ` L ${px(pts.length - 1).toFixed(1)} ${H - PAD.b} L ${PAD.l} ${H - PAD.b} Z`;
  const last = pts[pts.length - 1];
  const gid = 'g' + acc.host.slice(-4);

  svg.innerHTML = `
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${C.blue}" stop-opacity=".25"/>
      <stop offset="1" stop-color="${C.blue}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${PAD.l}" y1="${py(base).toFixed(1)}" x2="${W - PAD.r}" y2="${py(base).toFixed(1)}"
      stroke="${C.muted}" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${C.blue}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${px(pts.length - 1).toFixed(1)}" cy="${py(last.v).toFixed(1)}" r="4"
      fill="${C.bg}" stroke="${C.blue}" stroke-width="2"/>
    <line class="xhair" x1="0" y1="${PAD.t}" x2="0" y2="${H - PAD.b}"
      stroke="${C.ink2}" stroke-width="1" opacity="0"/>
    <text x="${PAD.l}" y="${H - 5}" fill="${C.muted}" font-size="10">${pts[0].date}</text>
    <text x="${W - PAD.r}" y="${H - 5}" fill="${C.muted}" font-size="10"
      text-anchor="end">${last.date}${last.live ? ' (live)' : ''}</text>`;

  const tip = acc.el('tip'), xhair = svg.querySelector('.xhair');
  function showAt(clientX) {
    const r = svg.getBoundingClientRect();
    const fx = (clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(pts.length - 1,
      Math.round((fx - PAD.l) / rect.w * (pts.length - 1))));
    xhair.setAttribute('x1', px(i)); xhair.setAttribute('x2', px(i));
    xhair.setAttribute('opacity', '.5');
    tip.style.display = 'block';
    tip.innerHTML = `${pts[i].date}${pts[i].live ? ' (live)' : ''} · <b class="num">${money(pts[i].v)}</b>`;
  }
  function hide() { xhair.setAttribute('opacity', '0'); tip.style.display = 'none'; }
  svg.onpointerdown = e => { svg.setPointerCapture(e.pointerId); showAt(e.clientX); };
  svg.onpointermove = e => { if (e.buttons || e.pointerType === 'touch') showAt(e.clientX); };
  svg.onpointerup = svg.onpointercancel = hide;
}

/* ═══════════════════════ WEEKLY REPORT GENERATOR ═══════════════════════ */
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);          // nearest Thursday
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { year: t.getUTCFullYear(),
           week: Math.ceil(((t - y0) / 86400000 + 1) / 7) };
}
function weekRange(d) {
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const day = t.getUTCDay() || 7;
  const mon = new Date(t); mon.setUTCDate(t.getUTCDate() - day + 1);
  const fri = new Date(mon); fri.setUTCDate(mon.getUTCDate() + 4);
  return { mon, fri };
}
const iso = d => d.toISOString().slice(0, 10);
const shortDate = d => d.toLocaleDateString('en-US',
  { month: 'short', day: 'numeric', timeZone: 'UTC' });

function reportDate(acc) {
  const d = new Date();
  d.setUTCDate(d.getUTCDate() - 7 * acc.weekOffset);
  return d;
}

function updateWeekLabel(acc) {
  const d = reportDate(acc);
  const { year, week } = isoWeek(d);
  const { mon, fri } = weekRange(d);
  acc.el('gen_week').textContent =
    `Week ${week} · ${shortDate(mon)} – ${shortDate(fri)} ${year}`;
}

async function generateReport(acc) {
  const btn = acc.el('gen_btn');
  btn.disabled = true; btn.textContent = 'Generating…';
  try {
    const now = reportDate(acc);
    const { year, week } = isoWeek(now);
    const { mon, fri } = weekRange(now);
    const stats = await j(acc.host,
      `/api/stats?start=${iso(mon)}&end=${iso(fri)}`);
    if (!acc.equity) { try { acc.equity = await j(acc.host, '/api/equity'); } catch (e) {} }

    const label = `WEEK ${week} · ${shortDate(mon).toUpperCase()} – ${shortDate(fri).toUpperCase()} ${year}`;
    const prefix = `tia-${year}-w${week}`;
    const slides = [
      { name: `${prefix}-1-cover.png`, w: 1080, h: 1350, draw: c => slideCover(c, label, stats, acc) },
      { name: `${prefix}-2-stats.png`, w: 1080, h: 1350, draw: c => slideStats(c, label, stats) },
      { name: `${prefix}-3-equity.png`, w: 1080, h: 1350, draw: c => slideEquity(c, label, acc) },
      { name: `${prefix}-4-best.png`, w: 1080, h: 1350, draw: c => slideTrade(c, label, stats.best_trade, 'BEST TRADE', C.brand) },
      { name: `${prefix}-5-worst.png`, w: 1080, h: 1350, draw: c => slideTrade(c, label, stats.worst_trade, 'WORST TRADE', C.red) },
      { name: `${prefix}-6-thumb.png`, w: 1920, h: 1080, draw: c => slideThumb(c, label, stats) },
    ];

    const gallery = acc.el('gallery');
    gallery.innerHTML = '';
    for (const s of slides) {
      const canvas = document.createElement('canvas');
      canvas.width = s.w; canvas.height = s.h;
      s.draw(canvas);
      const box = document.createElement('div');
      box.className = 'slide-box';
      box.appendChild(canvas);
      const dl = document.createElement('div');
      dl.className = 'dl';
      dl.innerHTML = `<span>${s.name.replace(prefix + '-', '')}</span>`;
      const b = document.createElement('button');
      b.className = 'dl-btn'; b.textContent = 'Save';
      b.addEventListener('click', () => canvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = s.name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }, 'image/png'));
      dl.appendChild(b);
      box.appendChild(dl);
      gallery.appendChild(box);
    }
  } finally {
    btn.disabled = false; btn.textContent = 'Generate Weekly Report';
  }
}

/* canvas helpers */
function slideBase(canvas, label) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const s = W / 1080;                                  // scale factor
  // wordmark
  ctx.fillStyle = C.ink;
  ctx.font = `700 ${64 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('T  I  A', 80 * s, 130 * s);
  ctx.fillStyle = C.muted;
  ctx.font = `600 ${22 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText('T H E   I M P E R F E C T   A L G O R I T H M', 80 * s, 168 * s);
  // brand accent bar
  ctx.fillStyle = C.brand;
  ctx.fillRect(80 * s, 195 * s, 120 * s, 6 * s);
  // week label top right
  ctx.fillStyle = C.ink2;
  ctx.font = `600 ${26 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.textAlign = 'right';
  ctx.fillText(label, W - 80 * s, 130 * s);
  // footer
  ctx.fillStyle = C.muted;
  ctx.font = `500 ${24 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('Built in Public. Traded in Public. Learning in Public.', W / 2, H - 60 * s);
  ctx.textAlign = 'left';
  return { ctx, W, H, s };
}

function slideCover(canvas, label, stats, acc) {
  const { ctx, W, H, s } = slideBase(canvas, label);
  const pnl = stats.pnl.period_usd;
  ctx.textAlign = 'center';
  ctx.fillStyle = C.ink2;
  ctx.font = `600 ${34 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText('WEEKLY P&L', W / 2, H * .40);
  ctx.fillStyle = pnl >= 0 ? C.brand : C.red;
  ctx.font = `800 ${150 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(signedMoney(pnl), W / 2, H * .52);
  ctx.fillStyle = C.ink2;
  ctx.font = `600 ${36 * s}px -apple-system, "Segoe UI", sans-serif`;
  const t = stats.trades;
  ctx.fillText(`${t.count} trades · ${t.win_rate_pct == null ? '—' : t.win_rate_pct + '%'} win rate`,
               W / 2, H * .60);
  ctx.fillStyle = C.muted;
  ctx.font = `500 ${28 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(acc.label, W / 2, H * .66);
  ctx.textAlign = 'left';
}

function bigStat(ctx, s, x, y, label, value, color) {
  ctx.textAlign = 'left';
  ctx.fillStyle = C.muted;
  ctx.font = `600 ${26 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(label, x, y);
  ctx.fillStyle = color || C.ink;
  ctx.font = `800 ${64 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(value, x, y + 74 * s);
}

function slideStats(canvas, label, stats) {
  const { ctx, W, H, s } = slideBase(canvas, label);
  const t = stats.trades;
  ctx.fillStyle = C.ink;
  ctx.font = `700 ${44 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText('THE WEEK IN NUMBERS', 80 * s, 320 * s);
  const col1 = 80 * s, col2 = W / 2 + 20 * s;
  const rows = [420, 600, 780, 960].map(v => v * s);
  bigStat(ctx, s, col1, rows[0], 'TRADES', String(t.count));
  bigStat(ctx, s, col2, rows[0], 'WIN RATE', t.win_rate_pct == null ? '—' : t.win_rate_pct + '%');
  bigStat(ctx, s, col1, rows[1], 'PROFIT FACTOR',
          t.profit_factor == null ? (t.count ? '∞' : '—') : t.profit_factor.toFixed(2));
  bigStat(ctx, s, col2, rows[1], 'EXPECTANCY',
          t.expectancy_r == null ? '—' : fmtR(t.expectancy_r),
          t.expectancy_r >= 0 ? C.brand : C.red);
  bigStat(ctx, s, col1, rows[2], 'GROSS WINS', signedMoney(t.gross_win_usd), C.brand);
  bigStat(ctx, s, col2, rows[2], 'GROSS LOSSES',
          t.gross_loss_usd ? signedMoney(t.gross_loss_usd) : '$0.00', C.red);
  bigStat(ctx, s, col1, rows[3], 'NET P&L', signedMoney(stats.pnl.period_usd),
          stats.pnl.period_usd >= 0 ? C.brand : C.red);
  bigStat(ctx, s, col2, rows[3], 'MAX DRAWDOWN', stats.max_drawdown_pct + '%');
}

function slideEquity(canvas, label, acc) {
  const { ctx, W, H, s } = slideBase(canvas, label);
  ctx.fillStyle = C.ink;
  ctx.font = `700 ${44 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText('EQUITY CURVE', 80 * s, 320 * s);
  const pts = equityPoints({ ...acc, range: 'all' });
  const rect = { l: 80 * s, t: 380 * s, w: W - 160 * s, h: H * .5 };
  if (pts.length < 2) {
    ctx.fillStyle = C.muted;
    ctx.font = `500 ${30 * s}px -apple-system, "Segoe UI", sans-serif`;
    ctx.fillText('Not enough history yet', rect.l, rect.t + 60 * s);
    return;
  }
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1; lo -= span * .1; hi += span * .1;
  const px = i => rect.l + i / (pts.length - 1) * rect.w;
  const py = v => rect.t + (1 - (v - lo) / (hi - lo)) * rect.h;
  // area
  const grad = ctx.createLinearGradient(0, rect.t, 0, rect.t + rect.h);
  grad.addColorStop(0, 'rgba(57,135,229,.28)');
  grad.addColorStop(1, 'rgba(57,135,229,0)');
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(px(i), py(p.v)) : ctx.moveTo(px(i), py(p.v)));
  ctx.lineTo(px(pts.length - 1), rect.t + rect.h);
  ctx.lineTo(rect.l, rect.t + rect.h);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // line
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(px(i), py(p.v)) : ctx.moveTo(px(i), py(p.v)));
  ctx.strokeStyle = C.blue; ctx.lineWidth = 5 * s;
  ctx.lineJoin = ctx.lineCap = 'round';
  ctx.stroke();
  // end dot + value
  const last = pts[pts.length - 1];
  ctx.beginPath();
  ctx.arc(px(pts.length - 1), py(last.v), 9 * s, 0, Math.PI * 2);
  ctx.fillStyle = C.bg; ctx.fill();
  ctx.strokeStyle = C.blue; ctx.lineWidth = 4 * s; ctx.stroke();
  ctx.fillStyle = C.ink;
  ctx.font = `700 ${34 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.textAlign = 'right';
  ctx.fillText(money(last.v), W - 80 * s, py(last.v) - 20 * s);
  // x labels
  ctx.fillStyle = C.muted;
  ctx.font = `500 ${24 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText(pts[0].date, rect.l, rect.t + rect.h + 44 * s);
  ctx.textAlign = 'right';
  ctx.fillText(last.date, rect.l + rect.w, rect.t + rect.h + 44 * s);
  ctx.textAlign = 'left';
}

function slideTrade(canvas, label, trade, title, color) {
  const { ctx, W, H, s } = slideBase(canvas, label);
  ctx.fillStyle = color;
  ctx.font = `700 ${44 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(title, 80 * s, 320 * s);
  if (!trade) {
    ctx.fillStyle = C.muted;
    ctx.font = `500 ${30 * s}px -apple-system, "Segoe UI", sans-serif`;
    ctx.fillText('No closed trades this week', 80 * s, 420 * s);
    return;
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = C.ink;
  ctx.font = `800 ${92 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(`${trade.pair} ${trade.direction}`, W / 2, H * .42);
  ctx.fillStyle = color;
  ctx.font = `800 ${130 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(signedMoney(trade.pnl), W / 2, H * .54);
  ctx.fillStyle = C.ink2;
  ctx.font = `600 ${36 * s}px -apple-system, "Segoe UI", sans-serif`;
  const hh = trade.hold_hours != null ? ` after ${trade.hold_hours.toFixed(1)}h` : '';
  const rr = trade.r != null ? ` · ${fmtR(trade.r)}` : '';
  ctx.fillText(`Exit: ${trade.reason || '?'}${hh}${rr}`, W / 2, H * .61);
  ctx.fillStyle = C.muted;
  ctx.font = `500 ${28 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(trade.date, W / 2, H * .66);
  ctx.textAlign = 'left';
}

function slideThumb(canvas, label, stats) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, s = H / 1080;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // subtle brand glow bottom-left
  const glow = ctx.createRadialGradient(W * .2, H * .85, 0, W * .2, H * .85, H * .8);
  glow.addColorStop(0, 'rgba(23,232,143,.12)');
  glow.addColorStop(1, 'rgba(23,232,143,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  // wordmark
  ctx.fillStyle = C.ink;
  ctx.font = `700 ${70 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText('T  I  A', 90 * s, 150 * s);
  ctx.fillStyle = C.muted;
  ctx.font = `600 ${24 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText('T H E   I M P E R F E C T   A L G O R I T H M', 90 * s, 195 * s);
  // left-aligned headline block; right ~45% left as negative space for a face
  ctx.fillStyle = C.ink2;
  ctx.font = `600 ${40 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(label, 90 * s, H * .46);
  const pnl = stats.pnl.period_usd;
  ctx.fillStyle = pnl >= 0 ? C.brand : C.red;
  ctx.font = `800 ${170 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(signedMoney(pnl), 85 * s, H * .63);
  const t = stats.trades;
  ctx.fillStyle = C.ink2;
  ctx.font = `600 ${44 * s}px -apple-system, "Segoe UI", sans-serif`;
  ctx.fillText(`${t.count} trades · ${t.win_rate_pct == null ? '—' : t.win_rate_pct + '%'} win rate`,
               90 * s, H * .72);
}

/* ═══════════════════════ TICKERS / BOOT ═══════════════════════ */
setInterval(() => {
  const el = document.getElementById('updated');
  if (!lastUpdate) { el.textContent = 'loading…'; return; }
  const sec = Math.round((Date.now() - lastUpdate) / 1000);
  el.textContent = sec < 5 ? 'updated just now' : `updated ${sec}s ago`;

setInterval(() => state.forEach(acc => { renderNews(acc); renderSessions(acc); }), 30_000);

if (!KEY) {
  document.getElementById('nokey').style.display = 'block';
  document.querySelector('header').style.display = 'none';
} else {
  refreshFast().then(refreshSlow);
  setInterval(refreshFast, 45_000);
  setInterval(refreshSlow, 300_000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { refreshFast(); refreshSlow(); }
  });
}
